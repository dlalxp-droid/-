name: One-shot publish 2026-05-11 AM

# 5/11 AM 슬롯이 cron 지연으로 정시에 안 올라간 케이스. instagram-publish.yml
# 의 새 로직이 default branch 에 머지되기 전에 빠르게 게시하기 위한 일회용
# 트리거. 게시 성공 후엔 이 파일을 제거하면 됨.

on:
  push:
    paths:
      - .github/workflows/publish-2026-05-11-am-oneshot.yml

permissions:
  contents: write

concurrency:
  group: cardnews-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r cardnews-system/requirements.txt

      - name: Publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python cardnews-system/scheduler.py --slot AM --date 2026-05-11

      - name: Commit published.flag
        if: success()
        run: |
          FLAG=cardnews-system/output/2026-05-11/AM/published.flag
          if [ ! -f "$FLAG" ]; then
            echo "no flag — scheduler skipped (already published?); nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FLAG"
          if git diff --cached --quiet; then
            echo "flag already committed"
            exit 0
          fi
          git commit -m "publish: 2026-05-11 AM (one-shot)"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed ($i/5)"
            git fetch origin "$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((i * 2))
          done
          exit 1
