name: Auto-approve cardnews (B-flow)

# 게시 2.5h 전에 draft → approved 자동 승급.
# rejected.flag 가 있는 슬롯은 스킵.
#
# AM   게시 KST 09:00 → 자동 승인 KST 06:30 = UTC 21:30 (전날)
# NOON 게시 KST 13:00 → 자동 승인 KST 10:30 = UTC 01:30 (당일)
# PM   게시 KST 17:00 → 자동 승인 KST 14:30 = UTC 05:30 (당일)

on:
  schedule:
    # GitHub Actions cron 은 5~60분 드리프트가 흔하고, 한 번 빠지면 그 슬롯이
    # 영영 안 돈다. 슬롯당 3회(20분 간격) 재시도해서 catch-up. 두 번째 이후는
    # idempotency 로 noop — draft → approved 가 이미 끝나 있으면 변경 0건.
    - cron: "30 21 * * *"  # AM   첫 시도 KST 06:30
    - cron: "50 21 * * *"  # AM   재시도 KST 06:50
    - cron: "10 22 * * *"  # AM   재시도 KST 07:10
    - cron: "30 1 * * *"   # NOON 첫 시도 KST 10:30
    - cron: "50 1 * * *"   # NOON 재시도 KST 10:50
    - cron: "10 2 * * *"   # NOON 재시도 KST 11:10
    - cron: "30 5 * * *"   # PM   첫 시도 KST 14:30
    - cron: "50 5 * * *"   # PM   재시도 KST 14:50
    - cron: "10 6 * * *"   # PM   재시도 KST 15:10
  workflow_dispatch:
    inputs:
      slot:
        description: "AM | NOON | PM"
        required: true
        type: choice
        options: [AM, NOON, PM]
      date:
        description: "YYYY-MM-DD (비우면 오늘 KST)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cardnews-output-write
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve slot & date (KST)
        id: ctx
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            SLOT="${{ inputs.slot }}"
          else
            case "${{ github.event.schedule }}" in
              "30 21 * * *"|"50 21 * * *"|"10 22 * * *")  SLOT="AM"   ;;
              "30 1 * * *"|"50 1 * * *"|"10 2 * * *")     SLOT="NOON" ;;
              *)                                           SLOT="PM"   ;;
            esac
          fi
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Run approve.py
        run: python cardnews-system/approve.py --date "${{ steps.ctx.outputs.date }}" --slot "${{ steps.ctx.outputs.slot }}"

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cardnews-system/output/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "auto-approve ${{ steps.ctx.outputs.date }} ${{ steps.ctx.outputs.slot }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i/5), pulling --rebase"
            git fetch origin "$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((i * 2))
          done
          echo "push failed after 5 attempts"
          exit 1
