name: Auto-approve cardnews (B-flow)

# 게시 2.5h 전에 draft → approved 자동 승급.
# rejected.flag 가 있는 슬롯은 스킵.
#
# AM   게시 KST 09:00 → 자동 승인 KST 06:30 = UTC 21:30 (전날)
# NOON 게시 KST 13:00 → 자동 승인 KST 10:30 = UTC 01:30 (당일)
# PM   게시 KST 17:00 → 자동 승인 KST 14:30 = UTC 05:30 (당일)

on:
  schedule:
    - cron: "30 21 * * *"  # KST 06:30 (AM   슬롯 승인)
    - cron: "30 1 * * *"   # KST 10:30 (NOON 슬롯 승인)
    - cron: "30 5 * * *"   # KST 14:30 (PM   슬롯 승인)
  workflow_dispatch:
    inputs:
      slot:
        description: "AM | NOON | PM"
        required: true
        type: choice
        options: [AM, NOON, PM]
      date:
        description: "YYYY-MM-DD (비우면 오늘 KST)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: cardnews-output-write
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve slot & date (KST)
        id: ctx
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            SLOT="${{ inputs.slot }}"
          elif [ "${{ github.event.schedule }}" = "30 21 * * *" ]; then
            SLOT="AM"
          elif [ "${{ github.event.schedule }}" = "30 1 * * *" ]; then
            SLOT="NOON"
          else
            SLOT="PM"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Run approve.py
        run: python cardnews-system/approve.py --date "${{ steps.ctx.outputs.date }}" --slot "${{ steps.ctx.outputs.slot }}"

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cardnews-system/output/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "auto-approve ${{ steps.ctx.outputs.date }} ${{ steps.ctx.outputs.slot }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i/5), pulling --rebase"
            git fetch origin "$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((i * 2))
          done
          echo "push failed after 5 attempts"
          exit 1
