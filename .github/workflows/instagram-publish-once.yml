name: Publish cardnews to Instagram (one-shot)

# 임시 워크플로 — 2026-05-09 AM 슬롯 수동 업로드용.
# 업로드 성공 확인 후 이 파일은 삭제할 것.

on:
  push:
    branches:
      - claude/fix-instagram-upload-KyH8W
    paths:
      - .github/workflows/instagram-publish-once.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r cardnews-system/requirements.txt

      - name: Publish 2026-05-09 AM
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: python cardnews-system/scheduler.py --slot AM --date 2026-05-09
