name: Generate cardnews

# 수동 트리거. 일주일치(혹은 N일치) draft 카드뉴스를 생성해 main 에 push.
# push 가 발생하면 pages-deploy.yml 이 GitHub Pages 로 자동 배포.
#
# 필요한 secrets (LLM 모드일 때): ANTHROPIC_API_KEY

on:
  schedule:
    # 매일 새벽 KST 02:30 / 03:30 / 04:30 (UTC 17:30 / 18:30 / 19:30 전날)
    # — 3회 재시도. 이미 생성된 날짜의 caption 파일이 있으면 skip (idempotent).
    # GitHub Actions cron 드리프트 대응. UTC 17~19 는 미국 저녁 시간대로 비교적 안정적.
    - cron: "30 17 * * *"
    - cron: "30 18 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "단일 토픽 강제 (비우면 config.content.topics 풀 회전)"
        required: false
        default: ""
        type: string
      days:
        description: "며칠치 생성"
        required: true
        default: "7"
        type: string
      slots:
        description: "콤마구분 (AM,NOON,PM)"
        required: true
        default: "AM,NOON,PM"
        type: string
      start:
        description: "시작일 YYYY-MM-DD (비우면 내일 KST)"
        required: false
        type: string
      use_llm:
        description: "Claude 사용 (false면 더미 콘텐츠로 파이프라인 검증)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: cardnews-output-write
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r cardnews-system/requirements.txt

      - name: Install Chromium (Playwright)
        run: python -m playwright install --with-deps chromium

      - name: Resolve start date
        id: ctx
        run: |
          if [ -n "${{ inputs.start }}" ]; then
            START="${{ inputs.start }}"
          else
            START=$(TZ=Asia/Seoul date -d 'tomorrow' +%F)
          fi
          echo "start=$START" >> $GITHUB_OUTPUT

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TOPIC: ${{ inputs.topic }}
          # schedule 트리거 시엔 매일 1일치만 생성 (내일분). dispatch 시엔 입력값.
          DAYS: ${{ github.event_name == 'schedule' && '1' || inputs.days }}
          SLOTS: ${{ github.event_name == 'schedule' && 'AM,NOON,PM' || inputs.slots }}
          START: ${{ steps.ctx.outputs.start }}
          USE_LLM: ${{ github.event_name == 'schedule' && 'true' || inputs.use_llm }}
        run: |
          ARGS=(--days "$DAYS" --slots "$SLOTS" --start "$START" --skip-existing)
          if [ -n "$TOPIC" ]; then ARGS+=(--topic "$TOPIC"); fi
          if [ "$USE_LLM" != "true" ]; then ARGS+=(--no-llm); fi
          python cardnews-system/generate.py "${ARGS[@]}"

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cardnews-system/output cardnews-system/captions
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "generate cardnews: ${{ steps.ctx.outputs.start }} +${{ inputs.days }}d (${{ inputs.slots }})"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i/5), pulling --rebase"
            git fetch origin "$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((i * 2))
          done
          echo "push failed after 5 attempts"
          exit 1
