name: Publish cardnews to Instagram

# 매일 KST 09:00 / 13:00 / 17:00 자동 발행.
# scheduler.py 가 approved/ 폴더의 PNG들을 Meta Graph API 로 캐러셀 업로드.
#
# 필요한 GitHub secrets:
#   META_ACCESS_TOKEN
#   IG_USER_ID
#   CLOUDINARY_URL  (cloudinary://<api_key>:<api_secret>@<cloud_name>)

on:
  schedule:
    - cron: "0 0 * * *"    # KST 09:00 (UTC 00:00)
    - cron: "0 4 * * *"    # KST 13:00 (UTC 04:00)
    - cron: "0 8 * * *"    # KST 17:00 (UTC 08:00)
  workflow_dispatch:
    inputs:
      slot:
        required: true
        type: choice
        options: [AM, NOON, PM]
      date:
        required: false
        type: string
      dry_run:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

# 같은 슬롯이 동시에(혹은 짧은 간격으로 catch-up) 두 번 publish 되면 Meta 가
# 중복 콘텐츠를 rate limit (code=4) 으로 차단한다. 트리거 단위로 직렬화하고,
# 추가로 scheduler.py 에서 published.flag 로 idempotency 를 강제한다.
concurrency:
  group: cardnews-publish-${{ github.event.schedule || format('dispatch-{0}-{1}', inputs.date, inputs.slot) }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r cardnews-system/requirements.txt

      - name: Resolve slot & date
        id: ctx
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            SLOT="${{ inputs.slot }}"
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            SLOT="AM"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            SLOT="NOON"
          else
            SLOT="PM"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Ensure approved/ ready (inline-approve fallback)
        if: inputs.dry_run != true
        run: |
          DATE="${{ steps.ctx.outputs.date }}"
          SLOT="${{ steps.ctx.outputs.slot }}"
          SLOT_DIR="cardnews-system/output/$DATE/$SLOT"
          APPROVED="$SLOT_DIR/approved"
          DRAFT="$SLOT_DIR/draft"

          # auto-approve 워크플로가 이미 push 했을 수 있으니 항상 origin 최신 상태 반영.
          git fetch origin "$GITHUB_REF_NAME" --quiet || true
          git checkout "origin/$GITHUB_REF_NAME" -- cardnews-system/output 2>/dev/null || true

          if [ -f "$SLOT_DIR/rejected.flag" ]; then
            echo "rejected.flag present, scheduler.py will skip"
            exit 0
          fi

          count_pngs() {
            [ -d "$1" ] || { echo 0; return; }
            find "$1" -maxdepth 1 -name '*.png' | wc -l
          }

          APPROVED_COUNT=$(count_pngs "$APPROVED")
          if [ "$APPROVED_COUNT" -ge 3 ]; then
            echo "ready: $APPROVED_COUNT images in $APPROVED"
            exit 0
          fi

          # auto-approve cron 이 늦거나(GitHub Actions 스케줄러는 1~3시간 지연되는 경우가
          # 흔함) 아직 안 돌았을 수 있다. draft 가 준비되어 있으면 인라인으로 승급해서
          # publish 가 한 번에 끝나도록 한다. approve.py 는 idempotent 라 나중에
          # auto-approve 가 늦게 깨어나도 안전.
          DRAFT_COUNT=$(count_pngs "$DRAFT")
          if [ "$DRAFT_COUNT" -ge 3 ]; then
            echo "auto-approve not committed yet; running inline approve.py ($DRAFT_COUNT draft cards)"
            python cardnews-system/approve.py --date "$DATE" --slot "$SLOT"
            exit 0
          fi

          echo "neither approved/ nor draft/ ready ($APPROVED_COUNT approved, $DRAFT_COUNT draft); scheduler will skip-and-notify"

      - name: Publish
        id: publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          ARGS="--slot ${{ steps.ctx.outputs.slot }} --date ${{ steps.ctx.outputs.date }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python cardnews-system/scheduler.py $ARGS

      - name: Commit published.flag
        if: success() && inputs.dry_run != true
        run: |
          DATE="${{ steps.ctx.outputs.date }}"
          SLOT="${{ steps.ctx.outputs.slot }}"
          FLAG="cardnews-system/output/$DATE/$SLOT/published.flag"
          if [ ! -f "$FLAG" ]; then
            echo "no flag (skip-and-notify path); nothing to commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FLAG"
          if git diff --cached --quiet; then
            echo "flag already committed"
            exit 0
          fi
          git commit -m "publish: $DATE $SLOT"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i/5), pulling --rebase"
            git fetch origin "$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((i * 2))
          done
          echo "published successfully but failed to push flag — manual flag commit needed"
          exit 1

      - name: Open issue on failure
        if: failure() && inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.ctx.outputs.date }}';
            const slot = '${{ steps.ctx.outputs.slot }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '인스타 자동 업로드가 실패했습니다.',
              '',
              `- 일자: ${date}`,
              `- 슬롯: ${slot}`,
              `- 워크플로 실행 로그: ${runUrl}`,
              '',
              '흔한 원인:',
              '1. `approved/` 폴더가 비어 있음 (auto-approve 가 안 돌았거나 rejected.flag 있음)',
              '2. `META_ACCESS_TOKEN` 무효 → 시스템 사용자 토큰 재발급 후 secret 갱신',
              '3. `CLOUDINARY_URL` 무효/할당량 초과 → Cloudinary 콘솔에서 확인',
              '4. Meta API rate limit (지수 백오프 3회 자동 재시도 후에도 실패)',
              '',
              '워크플로 로그를 먼저 확인하세요. 해결되면 이 이슈를 닫으세요.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[publish-failure] ${date} ${slot}`,
              body,
            });
