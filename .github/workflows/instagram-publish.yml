name: Publish cardnews to Instagram

# 매일 KST 08:30 / 18:00 자동 발행.
# scheduler.py 가 approved/ 폴더의 PNG들을 Meta Graph API 로 캐러셀 업로드.
#
# 필요한 GitHub secrets:
#   META_ACCESS_TOKEN
#   IG_USER_ID
#   CLOUDINARY_URL  (cloudinary://<api_key>:<api_secret>@<cloud_name>)

on:
  schedule:
    - cron: "30 23 * * *"  # KST 08:30 (UTC 23:30 전날)
    - cron: "0 9 * * *"    # KST 18:00 (UTC 09:00)
  workflow_dispatch:
    inputs:
      slot:
        required: true
        type: choice
        options: [AM, PM]
      date:
        required: false
        type: string
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r cardnews-system/requirements.txt

      - name: Resolve slot & date
        id: ctx
        run: |
          if [ -n "${{ inputs.slot }}" ]; then
            SLOT="${{ inputs.slot }}"
          elif [ "${{ github.event.schedule }}" = "30 23 * * *" ]; then
            SLOT="AM"
          else
            SLOT="PM"
          fi
          if [ -n "${{ inputs.date }}" ]; then
            DATE="${{ inputs.date }}"
          else
            DATE=$(TZ=Asia/Seoul date +%F)
          fi
          echo "slot=$SLOT" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT

      - name: Wait for approved/ folder (auto-approve race buffer)
        if: inputs.dry_run != true
        run: |
          DATE="${{ steps.ctx.outputs.date }}"
          SLOT="${{ steps.ctx.outputs.slot }}"
          SLOT_DIR="cardnews-system/output/$DATE/$SLOT"
          DIR="$SLOT_DIR/approved"
          for i in 1 2 3 4 5 6; do
            git fetch origin "$GITHUB_REF_NAME" --quiet || true
            git checkout "origin/$GITHUB_REF_NAME" -- cardnews-system/output 2>/dev/null || true
            if [ -f "$SLOT_DIR/rejected.flag" ]; then
              echo "rejected.flag present, scheduler.py will skip"
              exit 0
            fi
            COUNT=0
            if [ -d "$DIR" ]; then
              COUNT=$(find "$DIR" -maxdepth 1 -name '*.png' | wc -l)
            fi
            if [ "$COUNT" -ge 3 ]; then
              echo "ready: $COUNT images in $DIR"
              exit 0
            fi
            echo "attempt $i/6: $COUNT images in $DIR, sleeping 30s"
            sleep 30
          done
          echo "approved/ not ready after 3min, proceeding (scheduler will skip-and-notify)"

      - name: Publish
        id: publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
        run: |
          ARGS="--slot ${{ steps.ctx.outputs.slot }} --date ${{ steps.ctx.outputs.date }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          python cardnews-system/scheduler.py $ARGS

      - name: Open issue on failure
        if: failure() && inputs.dry_run != true
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.ctx.outputs.date }}';
            const slot = '${{ steps.ctx.outputs.slot }}';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '인스타 자동 업로드가 실패했습니다.',
              '',
              `- 일자: ${date}`,
              `- 슬롯: ${slot}`,
              `- 워크플로 실행 로그: ${runUrl}`,
              '',
              '흔한 원인:',
              '1. `approved/` 폴더가 비어 있음 (auto-approve 가 안 돌았거나 rejected.flag 있음)',
              '2. `META_ACCESS_TOKEN` 무효 → 시스템 사용자 토큰 재발급 후 secret 갱신',
              '3. `CLOUDINARY_URL` 무효/할당량 초과 → Cloudinary 콘솔에서 확인',
              '4. Meta API rate limit (지수 백오프 3회 자동 재시도 후에도 실패)',
              '',
              '워크플로 로그를 먼저 확인하세요. 해결되면 이 이슈를 닫으세요.',
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[publish-failure] ${date} ${slot}`,
              body,
            });
