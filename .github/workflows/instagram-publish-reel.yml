name: Instagram Publish (Reels)

# 매일 KST 13:00 (NOON) 에 자동 발행 + 수동 트리거.
# 카드뉴스와 같은 단일 concurrency group → Meta rate limit 충돌 방지.

on:
  schedule:
    # NOON 슬롯 릴스 발행. UTC 04:00~06:52 = KST 13:00~15:52.
    # 정시(:00)/반(:30) 부하 피크 회피한 분(:07/:22/:37/:52)에 매 15분 = 12회 시도.
    # published_NOON.flag idempotency 로 첫 성공 후 나머지는 ffmpeg 설치 전 early-exit.
    - cron: "7,22,37,52 4-6 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "발행 대상 날짜 (YYYY-MM-DD, 기본=오늘 KST)"
        required: false
        default: ""
      slot:
        description: "릴스 소스로 쓸 카드뉴스 슬롯"
        required: false
        default: "NOON"
        type: choice
        options: ["AM", "NOON", "PM"]
      dry_run:
        description: "dry run (Cloudinary/IG 호출 안 함)"
        required: false
        default: false
        type: boolean

concurrency:
  group: cardnews-publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  publish-reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve date/slot
        id: ctx
        run: |
          DATE_IN="${{ inputs.date }}"
          if [ -z "$DATE_IN" ]; then
            DATE_IN=$(TZ=Asia/Seoul date +%F)
          fi
          # YYYYMMDD → YYYY-MM-DD 정규화 (사용자가 대시 빼고 입력해도 동작)
          case "$DATE_IN" in
            [0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9])
              DATE_IN="${DATE_IN:0:4}-${DATE_IN:4:2}-${DATE_IN:6:2}"
              ;;
          esac
          # cron 트리거는 NOON 고정. dispatch 는 입력값(기본 NOON).
          SLOT_IN="${{ inputs.slot }}"
          [ -z "$SLOT_IN" ] && SLOT_IN="NOON"
          echo "date=$DATE_IN"  >> $GITHUB_OUTPUT
          echo "slot=$SLOT_IN"  >> $GITHUB_OUTPUT
          echo "Target: $DATE_IN $SLOT_IN"

      # ffmpeg/render 같은 무거운 작업 전에 발행 필요 여부 먼저 판단.
      # 매 15분 cron 이라 이미 발행됐으면 여기서 즉시 종료 (ffmpeg 설치 안 함).
      - name: Guard — 발행 필요한지 확인
        id: guard
        run: |
          DATE="${{ steps.ctx.outputs.date }}"
          SLOT="${{ steps.ctx.outputs.slot }}"
          REEL_DIR="cardnews-system/output/$DATE/REEL"
          CAP="cardnews-system/captions/${DATE}_${SLOT}.txt"
          if [ -f "$REEL_DIR/published_$SLOT.flag" ]; then
            echo "이미 발행됨 → skip"
            echo "proceed=false" >> $GITHUB_OUTPUT
          elif [ ! -f "$CAP" ] && [ ! -f "$REEL_DIR/reel_$SLOT.mp4" ]; then
            echo "캡션도 MP4도 없음 (카드뉴스 생성 전) → skip"
            echo "proceed=false" >> $GITHUB_OUTPUT
          else
            echo "발행 진행"
            echo "proceed=true" >> $GITHUB_OUTPUT
          fi

      - name: Install ffmpeg
        if: steps.guard.outputs.proceed == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install Python deps
        if: steps.guard.outputs.proceed == 'true'
        run: |
          pip install --quiet Pillow requests cloudinary python-dotenv pyyaml anthropic

      - name: Generate MP4
        id: gen
        if: steps.guard.outputs.proceed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          DATE="${{ steps.ctx.outputs.date }}"
          SLOT="${{ steps.ctx.outputs.slot }}"
          REEL_DIR="cardnews-system/output/$DATE/REEL"
          MP4="$REEL_DIR/reel_$SLOT.mp4"
          if [ -f "$REEL_DIR/published_$SLOT.flag" ]; then
            echo "already published; skip MP4 generation"
            echo "skip=1" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ ! -f "$MP4" ]; then
            echo "rendering reel MP4 for $DATE $SLOT"
            python cardnews-system/reels/make_reel.py --date "$DATE" --slot "$SLOT"
          else
            echo "MP4 already exists: $MP4"
          fi
          ls -la "$REEL_DIR/"
          echo "skip=0" >> $GITHUB_OUTPUT

      - name: Publish to Instagram
        if: steps.guard.outputs.proceed == 'true' && steps.gen.outputs.skip != '1'
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID:        ${{ secrets.IG_USER_ID }}
          CLOUDINARY_URL:    ${{ secrets.CLOUDINARY_URL }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          DATE="${{ steps.ctx.outputs.date }}"
          SLOT="${{ steps.ctx.outputs.slot }}"
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then DRY="--dry-run"; fi
          python cardnews-system/reels/publish_reel.py --date "$DATE" --slot "$SLOT" $DRY

      - name: Commit MP4 + published flag
        if: always() && steps.guard.outputs.proceed == 'true' && inputs.dry_run != true && steps.gen.outputs.skip != '1'
        run: |
          DATE="${{ steps.ctx.outputs.date }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "cardnews-system/output/$DATE/REEL" 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "publish reel: $DATE ${{ steps.ctx.outputs.slot }}"
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push failed (attempt $i/5), pulling --rebase"
            git fetch origin "$GITHUB_REF_NAME"
            git pull --rebase origin "$GITHUB_REF_NAME"
            sleep $((i * 2))
          done
          echo "push failed after 5 retries — manual cleanup needed"
          exit 1

      - name: Open issue on failure
        if: failure() && steps.guard.outputs.proceed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const date = '${{ steps.ctx.outputs.date }}';
            const slot = '${{ steps.ctx.outputs.slot }}';
            const url  = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[reel-publish] ${date} ${slot} 실패`,
              body: [
                `**시각:** ${new Date().toISOString()}`,
                `**대상:** ${date} ${slot} 릴스`,
                `**워크플로 로그:** ${url}`,
                ``,
                `자주 보는 원인:`,
                `1. \`[preflight-scope]\` → 새 토큰에 instagram_content_publish 누락`,
                `2. \`code:4 subcode:2207051\` → IG 행동 제한 (실제 발행 됐을 수 있음, 인스타 직접 확인)`,
                `3. \`container ... ERROR\` → 영상 인코딩 실패 (Cloudinary URL 또는 영상 포맷 문제)`,
              ].join("\n"),
              labels: ["automation-failure", "reel"],
            });
