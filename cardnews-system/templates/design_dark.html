<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap');

  @font-face { font-family: 'Pretendard'; font-weight: 400;
    src: url('{{FONT_BASE}}/Pretendard-Regular.otf') format('opentype'); }
  @font-face { font-family: 'Pretendard'; font-weight: 500;
    src: url('{{FONT_BASE}}/Pretendard-Medium.otf') format('opentype'); }
  @font-face { font-family: 'Pretendard'; font-weight: 700;
    src: url('{{FONT_BASE}}/Pretendard-Bold.otf') format('opentype'); }

  :root {
    --bg:     {{COLOR_BG}};
    --ink:    {{COLOR_INK}};
    --accent: {{COLOR_ACCENT}};
    --pop:    {{COLOR_POP}};
    --sub:    rgba(255,255,255,0.55);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px; height: 1350px;
    background: var(--bg); color: var(--ink);
    font-family: 'Pretendard', sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: anywhere;
  }

  .card {
    position: relative; width: 1080px; height: 1350px;
    padding: 170px 120px 0 120px; overflow: hidden;
  }

  /* 상하단 골드/세이지 1px 라인 */
  .card::before, .card::after {
    content: ""; position: absolute; left: 120px; right: 120px;
    height: 1px; background: var(--accent); opacity: 0.6;
  }
  .card::before { top: 140px; }
  .card::after  { bottom: 140px; }

  .top-mark {
    text-align: center; color: var(--accent);
    font-size: 22px; font-weight: 500; letter-spacing: 6px;
    margin-bottom: 80px;
  }
  .top-mark::before { content: "—  "; }
  .top-mark::after  { content: "  —"; }

  .page-indicator {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center; color: var(--accent);
    font-size: 22px; font-weight: 500; letter-spacing: 4px;
  }
  .swipe-top {
    position: absolute; top: 160px; right: 120px;
    color: var(--sub); font-size: 22px; font-weight: 500;
  }

  .title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 500; font-size: 68px; line-height: 1.3;
    text-align: center; color: var(--ink); margin-bottom: 24px;
  }
  .title em {
    font-style: normal; color: var(--accent); font-weight: 700;
    display: inline-block; white-space: nowrap;
  }
  .title-mark {
    display: block; width: 50px; height: 1px;
    background: var(--accent); margin: 32px auto 40px;
  }

  .subtitle {
    text-align: center; color: var(--sub);
    font-size: 28px; font-weight: 400; line-height: 1.6;
    margin-bottom: 50px; letter-spacing: 0.3px;
  }

  .eyebrow {
    display: block; text-align: center; color: var(--accent);
    font-size: 22px; font-weight: 500; letter-spacing: 6px;
    margin-bottom: 50px;
  }

  /* Before/After */
  .ba { display: flex; flex-direction: column; gap: 20px; margin-top: 16px; }
  .ba .row {
    border-left: 2px solid var(--accent);
    padding: 24px 30px;
    background: rgba(255,255,255,0.04);
  }
  .ba .row.before { border-left-color: var(--pop); }
  .ba .row .tag {
    font-size: 20px; font-weight: 700; letter-spacing: 4px;
    color: var(--pop); margin-bottom: 10px;
  }
  .ba .row.after .tag { color: var(--accent); }
  .ba .row .line {
    font-size: 28px; line-height: 1.55; font-weight: 400; color: var(--ink);
  }

  /* 불릿 */
  .bullets { margin-top: 12px; }
  .bullets li {
    list-style: none; font-size: 30px; line-height: 1.7; font-weight: 400;
    color: var(--ink); padding-left: 36px; position: relative; margin-bottom: 16px;
  }
  .bullets li::before {
    content: "·"; position: absolute; left: 0; top: -8px;
    color: var(--accent); font-size: 60px; font-weight: 700;
  }

  /* 인용 */
  .ref {
    border: 1px solid rgba(255,255,255,0.15);
    padding: 30px 36px; margin-top: 12px;
  }
  .ref .ref-tag {
    font-size: 20px; font-weight: 700; letter-spacing: 4px;
    color: var(--accent); margin-bottom: 12px;
  }
  .ref .ref-body {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px; line-height: 1.6; font-weight: 500; color: var(--ink);
    font-style: italic;
  }

  .bottom-stack {
    position: absolute; bottom: 170px; left: 120px; right: 120px;
  }
  .signoff {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--sub);
  }
  .signoff .brand {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700; font-size: 26px; color: var(--ink);
  }
  .signoff .meta { font-size: 22px; font-weight: 400; }

  .card.cover { padding-top: 280px; }
  .card.cover .title { font-size: 76px; }
  .card.cover .subtitle { margin-bottom: 70px; }
</style>
</head>
<body>
  <div class="card {{COVER_CLASS}}">
    <div class="page-indicator">{{PAGE}} / {{TOTAL}}</div>
    {{#SWIPE}}<div class="swipe-top">{{SWIPE}} →</div>{{/SWIPE}}

    <div class="top-mark">RISK INSIGHT</div>

    {{#EYEBROW}}<div class="eyebrow">{{EYEBROW}}</div>{{/EYEBROW}}

    {{#TITLE}}<h1 class="title">{{{TITLE}}}</h1>{{/TITLE}}
    {{#TITLE}}<span class="title-mark"></span>{{/TITLE}}
    {{#SUBTITLE}}<p class="subtitle">{{SUBTITLE}}</p>{{/SUBTITLE}}

    {{BODY_HTML}}

    <div class="bottom-stack">
      <div class="signoff">
        <span class="brand">{{BRAND}}</span>
        <span class="meta">{{META}}</span>
      </div>
    </div>
  </div>
</body>
</html>
