<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap');

  @font-face { font-family: 'Pretendard'; font-weight: 400;
    src: url('{{FONT_BASE}}/Pretendard-Regular.otf') format('opentype'); }
  @font-face { font-family: 'Pretendard'; font-weight: 500;
    src: url('{{FONT_BASE}}/Pretendard-Medium.otf') format('opentype'); }
  @font-face { font-family: 'Pretendard'; font-weight: 700;
    src: url('{{FONT_BASE}}/Pretendard-Bold.otf') format('opentype'); }

  :root {
    --bg:     {{COLOR_BG}};
    --ink:    {{COLOR_INK}};
    --accent: {{COLOR_ACCENT}};
    --pop:    {{COLOR_POP}};
    --grad-start: {{GRAD_START}};
    --grad-end:   {{GRAD_END}};
    --sub:    rgba(255,255,255,0.78);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px; height: 1350px;
    background: linear-gradient(160deg, var(--grad-start) 0%, var(--grad-end) 100%);
    color: var(--ink);
    font-family: 'Pretendard', sans-serif;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all; overflow-wrap: anywhere;
  }

  .card {
    position: relative; width: 1080px; height: 1350px;
    padding: 200px 100px 0 100px; overflow: hidden;
  }

  /* 큰 따옴표 장식 */
  .quote-mark.open, .quote-mark.close {
    position: absolute;
    font-family: 'Noto Serif KR', serif;
    font-size: 220px; line-height: 1; color: var(--accent);
    opacity: 0.85;
  }
  .quote-mark.open  { top: 80px; left: 100px; }
  .quote-mark.close { bottom: 350px; right: 100px; }

  .page-indicator {
    position: absolute; bottom: 100px; left: 0; right: 0;
    text-align: center; color: var(--sub);
    font-size: 22px; font-weight: 500;
  }
  .swipe-top {
    position: absolute; top: 180px; right: 100px;
    color: var(--sub); font-size: 22px; font-weight: 500;
  }

  .title {
    font-family: 'Noto Serif KR', serif;
    font-weight: 500; font-size: 64px; line-height: 1.32;
    text-align: center; color: var(--ink); margin-bottom: 24px;
  }
  .title em {
    font-style: normal; color: var(--accent); font-weight: 700;
    display: inline-block; white-space: nowrap;
  }
  .title-mark {
    display: block; width: 60px; height: 2px;
    background: var(--accent); margin: 30px auto 36px;
  }

  .subtitle {
    text-align: center; color: var(--sub);
    font-size: 30px; font-weight: 400; line-height: 1.6;
    margin-bottom: 48px;
  }

  .eyebrow {
    display: block; text-align: center; color: var(--accent);
    font-size: 22px; font-weight: 500; letter-spacing: 6px;
    margin-bottom: 40px;
  }

  /* Before/After */
  .ba { display: flex; flex-direction: column; gap: 22px; margin-top: 16px; }
  .ba .row {
    background: rgba(255,255,255,0.08); backdrop-filter: blur(4px);
    border-left: 4px solid var(--accent); padding: 26px 32px; border-radius: 6px;
  }
  .ba .row.before { border-left-color: var(--pop); }
  .ba .row .tag {
    font-size: 20px; font-weight: 700; letter-spacing: 4px;
    color: var(--pop); margin-bottom: 10px;
  }
  .ba .row.after .tag { color: var(--accent); }
  .ba .row .line {
    font-size: 28px; line-height: 1.55; font-weight: 400; color: var(--ink);
  }

  .bullets { margin-top: 12px; }
  .bullets li {
    list-style: none; font-size: 30px; line-height: 1.7; font-weight: 400;
    color: var(--ink); padding-left: 38px; position: relative; margin-bottom: 16px;
  }
  .bullets li::before {
    content: "✦"; position: absolute; left: 0; top: 4px;
    color: var(--accent); font-size: 22px;
  }

  .ref {
    background: rgba(255,255,255,0.08); backdrop-filter: blur(4px);
    border-radius: 6px; padding: 32px 36px; margin-top: 12px;
  }
  .ref .ref-tag {
    font-size: 20px; font-weight: 700; letter-spacing: 4px;
    color: var(--accent); margin-bottom: 12px;
  }
  .ref .ref-body {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px; line-height: 1.6; font-weight: 500; color: var(--ink);
    font-style: italic;
  }

  .bottom-stack {
    position: absolute; bottom: 160px; left: 100px; right: 100px;
  }
  .signoff {
    display: flex; justify-content: space-between; align-items: baseline;
    color: var(--sub);
  }
  .signoff .brand {
    font-family: 'Noto Serif KR', serif;
    font-weight: 700; font-size: 28px; color: var(--ink);
  }
  .signoff .meta { font-size: 22px; }

  .card.cover { padding-top: 360px; }
  .card.cover .title { font-size: 72px; }
</style>
</head>
<body>
  <div class="card {{COVER_CLASS}}">
    <div class="quote-mark open">“</div>
    <div class="quote-mark close">”</div>
    <div class="page-indicator">{{PAGE}} / {{TOTAL}}</div>
    {{#SWIPE}}<div class="swipe-top">{{SWIPE}} →</div>{{/SWIPE}}

    {{#EYEBROW}}<div class="eyebrow">{{EYEBROW}}</div>{{/EYEBROW}}

    {{#TITLE}}<h1 class="title">{{{TITLE}}}</h1>{{/TITLE}}
    {{#TITLE}}<span class="title-mark"></span>{{/TITLE}}
    {{#SUBTITLE}}<p class="subtitle">{{SUBTITLE}}</p>{{/SUBTITLE}}

    {{BODY_HTML}}

    <div class="bottom-stack">
      <div class="signoff">
        <span class="brand">{{BRAND}}</span>
        <span class="meta">{{META}}</span>
      </div>
    </div>
  </div>
</body>
</html>
