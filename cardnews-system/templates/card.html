<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --navy: #0A1628;
    --cream: #F5F1E8;
    --gold: #C8A14B;
    --red: #B8321A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1080px;
    background: var(--cream);
    color: var(--navy);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1080px;
    padding: 88px 88px 0 88px;
    overflow: hidden;
  }

  /* 상단 라벨 */
  .eyebrow {
    display: inline-block;
    padding: 10px 22px;
    background: var(--navy);
    color: var(--gold);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 6px;
    margin-bottom: 56px;
  }

  /* 페이지 인디케이터 */
  .page-indicator {
    position: absolute;
    top: 88px;
    right: 88px;
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 700;
    color: var(--navy);
    opacity: 0.55;
    letter-spacing: 2px;
  }

  /* 메인 타이틀 */
  .title {
    font-family: 'Noto Serif KR', serif;
    font-size: 88px;
    font-weight: 900;
    line-height: 1.18;
    letter-spacing: -2px;
    color: var(--navy);
    margin-bottom: 36px;
  }
  .title em {
    font-style: normal;
    color: var(--red);
    border-bottom: 6px solid var(--gold);
    padding-bottom: 4px;
  }

  /* 서브 카피 */
  .subtitle {
    font-size: 34px;
    font-weight: 500;
    line-height: 1.5;
    color: #2a3a52;
    margin-bottom: 48px;
  }

  /* Before / After 박스 */
  .ba {
    display: flex;
    flex-direction: column;
    gap: 22px;
    margin-top: 12px;
  }
  .ba .row {
    background: #fff;
    border-left: 10px solid var(--gold);
    padding: 28px 32px;
    border-radius: 4px;
    box-shadow: 0 4px 18px rgba(10,22,40,0.06);
  }
  .ba .row.before { border-left-color: var(--red); }
  .ba .row .tag {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    margin-bottom: 10px;
    color: var(--red);
  }
  .ba .row.after .tag { color: var(--gold); }
  .ba .row .line {
    font-size: 30px;
    font-weight: 500;
    line-height: 1.45;
    color: var(--navy);
  }

  /* 본문 카피(불릿형) */
  .bullets {
    margin-top: 8px;
  }
  .bullets li {
    list-style: none;
    font-size: 32px;
    font-weight: 500;
    line-height: 1.55;
    color: var(--navy);
    padding-left: 38px;
    position: relative;
    margin-bottom: 16px;
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0; top: 18px;
    width: 18px; height: 18px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  /* 인용/근거 박스 */
  .ref {
    background: var(--navy);
    color: var(--cream);
    padding: 28px 32px;
    border-radius: 4px;
  }
  .ref .ref-tag {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--gold);
    margin-bottom: 10px;
  }
  .ref .ref-body {
    font-size: 28px;
    line-height: 1.5;
    font-weight: 500;
  }

  /* 하단 고정 스택 (스펙 고정) */
  .bottom-stack {
    position: absolute;
    bottom: 74px;
    left: 88px;
    right: 88px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .swipe {
    align-self: flex-end;
    font-size: 24px;
    font-weight: 700;
    color: var(--navy);
    letter-spacing: 2px;
    opacity: 0.7;
  }
  .signoff {
    border-top: 2px solid var(--navy);
    padding-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    font-size: 24px;
    min-height: 44px;
  }
  .signoff .brand {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: 0;
    color: var(--navy);
    white-space: nowrap;
    max-width: 65%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .signoff .meta {
    color: #5a6b80;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 표지(cover) 변형 */
  .card.cover {
    background: var(--navy);
    color: var(--cream);
  }
  .card.cover .title { color: var(--cream); font-size: 104px; }
  .card.cover .title em { color: var(--gold); border-bottom-color: var(--red); }
  .card.cover .subtitle { color: #d8d2c2; }
  .card.cover .eyebrow { background: var(--gold); color: var(--navy); }
  .card.cover .signoff { border-top-color: var(--cream); }
  .card.cover .signoff .brand { color: var(--cream); }
  .card.cover .signoff .meta { color: #b8c2d2; }
  .card.cover .page-indicator { color: var(--cream); opacity: 0.6; }
</style>
</head>
<body>
  <div class="card {{COVER_CLASS}}">
    <div class="page-indicator">{{PAGE}} / {{TOTAL}}</div>

    {{#EYEBROW}}<div class="eyebrow">{{EYEBROW}}</div>{{/EYEBROW}}

    {{#TITLE}}<h1 class="title">{{{TITLE}}}</h1>{{/TITLE}}
    {{#SUBTITLE}}<p class="subtitle">{{SUBTITLE}}</p>{{/SUBTITLE}}

    {{BODY_HTML}}

    <div class="bottom-stack">
      {{#SWIPE}}<div class="swipe">{{SWIPE}} →</div>{{/SWIPE}}
      <div class="signoff">
        <span class="brand">{{BRAND}}</span>
        <span class="meta">{{META}}</span>
      </div>
    </div>
  </div>
</body>
</html>
