<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --bg:     {{COLOR_BG}};
    --ink:    {{COLOR_INK}};
    --accent: {{COLOR_ACCENT}};
    --pop:    {{COLOR_POP}};
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1350px;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    /* 한글 가독성: 어절 단위 줄바꿈 + 긴 단어는 어디서든 끊을 수 있게 */
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1350px;
    padding: 120px 92px 0 92px;
    overflow: hidden;
  }

  /* 상단 라벨 */
  .eyebrow {
    display: inline-block;
    padding: 12px 24px;
    background: var(--ink);
    color: var(--accent);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 44px;
  }

  /* 페이지 인디케이터 */
  .page-indicator {
    position: absolute;
    top: 96px;
    right: 92px;
    font-family: 'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.5;
  }

  /* 메인 타이틀 */
  .title {
    font-family: 'Noto Serif KR', serif;
    font-size: 80px;
    font-weight: 900;
    line-height: 1.28;
    letter-spacing: -0.5px;
    color: var(--ink);
    margin-bottom: 36px;
  }
  .title em {
    font-style: normal;
    color: var(--pop);
    border-bottom: 6px solid var(--accent);
    padding-bottom: 4px;
    /* 강조구문은 통째로 한 줄 단위로 흐르게 — 두 줄에 걸쳐 underline 끊김 방지 */
    display: inline-block;
    white-space: nowrap;
  }
  .title br + em,
  .title em + br { /* <br> 주변 강조 underline 잘림 방지 */
    padding-bottom: 2px;
  }

  /* 서브 카피 */
  .subtitle {
    font-size: 36px;
    font-weight: 500;
    line-height: 1.6;
    letter-spacing: -0.3px;
    color: var(--ink);
    opacity: 0.78;
    margin-bottom: 44px;
  }

  /* Before / After 박스 */
  .ba {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-top: 12px;
  }
  .ba .row {
    background: #fff;
    border-left: 10px solid var(--accent);
    padding: 30px 34px;
    border-radius: 4px;
    box-shadow: 0 4px 18px rgba(10,22,40,0.06);
  }
  .ba .row.before { border-left-color: var(--pop); }
  .ba .row .tag {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 12px;
    color: var(--pop);
  }
  .ba .row.after .tag { color: var(--accent); }
  .ba .row .line {
    font-size: 30px;
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: -0.3px;
    color: var(--ink);
  }

  /* 본문 카피(불릿형) */
  .bullets {
    margin-top: 8px;
  }
  .bullets li {
    list-style: none;
    font-size: 34px;
    font-weight: 500;
    line-height: 1.7;
    letter-spacing: -0.3px;
    color: var(--ink);
    padding-left: 44px;
    position: relative;
    margin-bottom: 22px;
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0; top: 22px;
    width: 18px; height: 18px;
    background: var(--accent);
    transform: rotate(45deg);
  }

  /* 인용/근거 박스 */
  .ref {
    background: var(--ink);
    color: var(--bg);
    padding: 32px 36px;
    border-radius: 4px;
  }
  .ref .ref-tag {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .ref .ref-body {
    font-size: 30px;
    line-height: 1.6;
    letter-spacing: -0.3px;
    font-weight: 500;
  }

  /* 하단 고정 스택 (스펙 고정) */
  .bottom-stack {
    position: absolute;
    bottom: 74px;
    left: 88px;
    right: 88px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 다음 페이지 안내 — 우상단 (page-indicator 아래)
     본문 박스가 길어져도 겹치지 않도록 상단에 고정 */
  .swipe-top {
    position: absolute;
    top: 142px;
    right: 92px;
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    opacity: 0.65;
    letter-spacing: 0.5px;
    text-align: right;
    max-width: 360px;
  }
  .signoff {
    border-top: 2px solid var(--ink);
    padding-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    font-size: 24px;
    min-height: 44px;
  }
  .signoff .brand {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: 0;
    color: var(--ink);
    white-space: nowrap;
    max-width: 65%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .signoff .meta {
    color: var(--ink);
    opacity: 0.55;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ===================== 표지(cover) 변형 =====================
     var-a: 짙은 잉크 풀배경 + 액센트 아이브로우 (기존)
     var-b: 밝은 배경 + 두꺼운 액센트 프레임
     var-c: 밝은 배경 + 상단 액센트 스트라이프 200px
     cover 클래스 자체는 셋 다 공유. var-X 가 위를 오버라이드. */

  /* var-a (default cover) */
  .card.cover.var-a { background: var(--ink); color: var(--bg); }
  .card.cover.var-a .title { color: var(--bg); font-size: 92px; line-height: 1.22; }
  .card.cover.var-a .title em { color: var(--accent); border-bottom-color: var(--pop); }
  .card.cover.var-a .subtitle { color: var(--bg); opacity: 0.78; }
  .card.cover.var-a .eyebrow { background: var(--accent); color: var(--ink); }
  .card.cover.var-a .signoff { border-top-color: var(--bg); }
  .card.cover.var-a .signoff .brand { color: var(--bg); }
  .card.cover.var-a .signoff .meta { color: var(--bg); opacity: 0.6; }
  .card.cover.var-a .page-indicator { color: var(--bg); opacity: 0.6; }
  .card.cover.var-a .swipe-top { color: var(--bg); opacity: 0.7; }

  /* var-b (light + accent inset frame) — box-shadow trick: 28px bg gutter, 6px accent line */
  .card.cover.var-b {
    background: var(--bg);
    color: var(--ink);
    box-shadow: inset 0 0 0 28px var(--bg), inset 0 0 0 34px var(--accent);
  }
  .card.cover.var-b .title { font-size: 92px; line-height: 1.22; }
  .card.cover.var-b .title em { color: var(--pop); border-bottom-color: var(--accent); }
  .card.cover.var-b .eyebrow { background: var(--ink); color: var(--accent); }

  /* var-c (light + top accent stripe via gradient — 200px solid accent on top) */
  .card.cover.var-c {
    background: linear-gradient(
      to bottom,
      var(--accent) 0,
      var(--accent) 200px,
      var(--bg) 200px,
      var(--bg) 100%
    );
    color: var(--ink);
    padding-top: 244px;
  }
  .card.cover.var-c .page-indicator { color: var(--ink); opacity: 0.85; top: 70px; }
  .card.cover.var-c .swipe-top { color: var(--ink); opacity: 0.85; top: 110px; }
  .card.cover.var-c .eyebrow { background: var(--ink); color: var(--accent); margin-top: 0; }
  .card.cover.var-c .title { font-size: 92px; line-height: 1.22; }
  .card.cover.var-c .title em { color: var(--pop); border-bottom-color: var(--accent); }
</style>
</head>
<body>
  <div class="card {{COVER_CLASS}}">
    <div class="page-indicator">{{PAGE}} / {{TOTAL}}</div>
    {{#SWIPE}}<div class="swipe-top">{{SWIPE}} →</div>{{/SWIPE}}

    {{#EYEBROW}}<div class="eyebrow">{{EYEBROW}}</div>{{/EYEBROW}}

    {{#TITLE}}<h1 class="title">{{{TITLE}}}</h1>{{/TITLE}}
    {{#SUBTITLE}}<p class="subtitle">{{SUBTITLE}}</p>{{/SUBTITLE}}

    {{BODY_HTML}}

    <div class="bottom-stack">
      <div class="signoff">
        <span class="brand">{{BRAND}}</span>
        <span class="meta">{{META}}</span>
      </div>
    </div>
  </div>
</body>
</html>
