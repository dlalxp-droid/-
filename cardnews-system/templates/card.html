<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>card</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');

  :root {
    --navy: #0A1628;
    --cream: #F5F1E8;
    --gold: #C8A14B;
    --red: #B8321A;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 1080px;
    height: 1080px;
    background: var(--cream);
    color: var(--navy);
    font-family: 'Noto Sans KR', sans-serif;
    -webkit-font-smoothing: antialiased;
    /* 한글 가독성: 어절 단위 줄바꿈 + 긴 단어는 어디서든 끊을 수 있게 */
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .card {
    position: relative;
    width: 1080px;
    height: 1080px;
    padding: 96px 92px 0 92px;
    overflow: hidden;
  }

  /* 상단 라벨 */
  .eyebrow {
    display: inline-block;
    padding: 12px 24px;
    background: var(--navy);
    color: var(--gold);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 44px;
  }

  /* 페이지 인디케이터 */
  .page-indicator {
    position: absolute;
    top: 96px;
    right: 92px;
    font-family: 'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--navy);
    opacity: 0.5;
  }

  /* 메인 타이틀 */
  .title {
    font-family: 'Noto Serif KR', serif;
    font-size: 80px;
    font-weight: 900;
    line-height: 1.28;
    letter-spacing: -0.5px;
    color: var(--navy);
    margin-bottom: 36px;
  }
  .title em {
    font-style: normal;
    color: var(--red);
    border-bottom: 6px solid var(--gold);
    padding-bottom: 4px;
    /* 강조구문은 통째로 한 줄 단위로 흐르게 — 두 줄에 걸쳐 underline 끊김 방지 */
    display: inline-block;
    white-space: nowrap;
  }
  .title br + em,
  .title em + br { /* <br> 주변 강조 underline 잘림 방지 */
    padding-bottom: 2px;
  }

  /* 서브 카피 */
  .subtitle {
    font-size: 36px;
    font-weight: 500;
    line-height: 1.6;
    letter-spacing: -0.3px;
    color: #2a3a52;
    margin-bottom: 44px;
  }

  /* Before / After 박스 */
  .ba {
    display: flex;
    flex-direction: column;
    gap: 24px;
    margin-top: 12px;
  }
  .ba .row {
    background: #fff;
    border-left: 10px solid var(--gold);
    padding: 30px 34px;
    border-radius: 4px;
    box-shadow: 0 4px 18px rgba(10,22,40,0.06);
  }
  .ba .row.before { border-left-color: var(--red); }
  .ba .row .tag {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 12px;
    color: var(--red);
  }
  .ba .row.after .tag { color: var(--gold); }
  .ba .row .line {
    font-size: 30px;
    font-weight: 500;
    line-height: 1.55;
    letter-spacing: -0.3px;
    color: var(--navy);
  }

  /* 본문 카피(불릿형) */
  .bullets {
    margin-top: 8px;
  }
  .bullets li {
    list-style: none;
    font-size: 34px;
    font-weight: 500;
    line-height: 1.7;
    letter-spacing: -0.3px;
    color: var(--navy);
    padding-left: 44px;
    position: relative;
    margin-bottom: 22px;
  }
  .bullets li::before {
    content: "";
    position: absolute;
    left: 0; top: 22px;
    width: 18px; height: 18px;
    background: var(--gold);
    transform: rotate(45deg);
  }

  /* 인용/근거 박스 */
  .ref {
    background: var(--navy);
    color: var(--cream);
    padding: 32px 36px;
    border-radius: 4px;
  }
  .ref .ref-tag {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .ref .ref-body {
    font-size: 30px;
    line-height: 1.6;
    letter-spacing: -0.3px;
    font-weight: 500;
  }

  /* 하단 고정 스택 (스펙 고정) */
  .bottom-stack {
    position: absolute;
    bottom: 74px;
    left: 88px;
    right: 88px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* 다음 페이지 안내 — 우상단 (page-indicator 아래)
     본문 박스가 길어져도 겹치지 않도록 상단에 고정 */
  .swipe-top {
    position: absolute;
    top: 142px;
    right: 92px;
    font-size: 22px;
    font-weight: 700;
    color: var(--navy);
    opacity: 0.65;
    letter-spacing: 0.5px;
    text-align: right;
    max-width: 360px;
  }
  .signoff {
    border-top: 2px solid var(--navy);
    padding-top: 16px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    font-size: 24px;
    min-height: 44px;
  }
  .signoff .brand {
    font-family: 'Noto Serif KR', serif;
    font-weight: 900;
    font-size: 30px;
    line-height: 1.1;
    letter-spacing: 0;
    color: var(--navy);
    white-space: nowrap;
    max-width: 65%;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .signoff .meta {
    color: #5a6b80;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* 표지(cover) 변형 */
  .card.cover {
    background: var(--navy);
    color: var(--cream);
  }
  .card.cover .title {
    color: var(--cream);
    font-size: 92px;
    line-height: 1.22;
  }
  .card.cover .title em { color: var(--gold); border-bottom-color: var(--red); }
  .card.cover .subtitle { color: #d8d2c2; }
  .card.cover .eyebrow { background: var(--gold); color: var(--navy); }
  .card.cover .signoff { border-top-color: var(--cream); }
  .card.cover .signoff .brand { color: var(--cream); }
  .card.cover .signoff .meta { color: #b8c2d2; }
  .card.cover .page-indicator { color: var(--cream); opacity: 0.6; }
  .card.cover .swipe-top { color: var(--cream); opacity: 0.7; }
</style>
</head>
<body>
  <div class="card {{COVER_CLASS}}">
    <div class="page-indicator">{{PAGE}} / {{TOTAL}}</div>
    {{#SWIPE}}<div class="swipe-top">{{SWIPE}} →</div>{{/SWIPE}}

    {{#EYEBROW}}<div class="eyebrow">{{EYEBROW}}</div>{{/EYEBROW}}

    {{#TITLE}}<h1 class="title">{{{TITLE}}}</h1>{{/TITLE}}
    {{#SUBTITLE}}<p class="subtitle">{{SUBTITLE}}</p>{{/SUBTITLE}}

    {{BODY_HTML}}

    <div class="bottom-stack">
      <div class="signoff">
        <span class="brand">{{BRAND}}</span>
        <span class="meta">{{META}}</span>
      </div>
    </div>
  </div>
</body>
</html>
