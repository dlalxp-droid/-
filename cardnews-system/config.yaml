# 카드뉴스 자동화 설정
brand:
  # ↓ 반드시 본인 이름 또는 개인 브랜드명으로 교체하세요. 소속 GA명 표기 금지.
  name: "보.보.분"
  meta: "@bo.bo_bun"

design:
  width: 1080
  height: 1080
  cards_per_set_min: 2
  cards_per_set_max: 2
  # 6개의 따뜻한 프리미엄 팔레트. 토픽 인덱스 % 6 으로 결정적으로 선택되어
  # 같은 토픽은 항상 같은 팔레트, 토픽이 다르면 색조가 달라진다.
  # deep-navy-cream(옛 default 톤) 은 의도적으로 마지막. 첫 토픽들이 새 톤으로 보이도록.
  # bg=배경, ink=텍스트/짙은면, accent=골드/밑줄, pop=강조/Before
  palettes:
    - name: "mocha-sage"
      bg:     "#EFE7DA"
      ink:    "#3A2E26"
      accent: "#8FA585"
      pop:    "#7C4A3A"
    - name: "wine-oat"
      bg:     "#EDE2CD"
      ink:    "#3D1F2D"
      accent: "#B8853A"
      pop:    "#8C2C3D"
    - name: "forest-cream"
      bg:     "#F0EAD9"
      ink:    "#1F3A2E"
      accent: "#B8923A"
      pop:    "#A04A1F"
    - name: "indigo-peach"
      bg:     "#F4E4D4"
      ink:    "#1F2A4D"
      accent: "#E8956A"
      pop:    "#C44E2C"
    - name: "charcoal-mustard"
      bg:     "#EFE8DA"
      ink:    "#2D2A26"
      accent: "#D4A437"
      pop:    "#A04A28"
    - name: "deep-navy-cream"
      bg:     "#F5F1E8"
      ink:    "#0A1628"
      accent: "#C8A14B"
      pop:    "#B8321A"
  # 토픽 인덱스 % 3 으로 표지 레이아웃 변형 선택.
  #   var-a: 짙은 잉크 풀배경 + 액센트 아이브로우 (기존)
  #   var-b: 밝은 배경 + 두꺼운 액센트 프레임
  #   var-c: 밝은 배경 + 상단 액센트 스트라이프
  cover_variants: ["var-a", "var-b", "var-c"]
  # 호환용 단일 색상 (palettes 미존재 시 폴백). 신규 코드는 사용 안 함.
  colors:
    navy: "#0A1628"
    cream: "#F5F1E8"
    gold:  "#C8A14B"
    red:   "#B8321A"

content:
  default_topic: "보험 상담 화법"
  # 40개 토픽. 슬롯마다 idx % len(topics) 로 회전 → 한 주(21슬롯) 안에 동일 주제 안 나옴.
  # CLI 에 --topic 을 따로 주면 단일 주제로 강제됩니다.
  topics:
    # === 핵심 화법 (기본 16) ===
    - "거절 처리 화법"
    - "니즈 환기 화법 (가족애 자극)"
    - "클로징 화법 (대안 클로징)"
    - "가족 동반 상담에서 결정권자 설득"
    - "DB콜 첫 30초 후킹 화법"
    - "기존 고객 추천 요청 화법"
    - "재무주치의 포지셔닝 화법"
    - "납입 방식 권유 화법 (장기납 vs 단기납)"
    - "리바이벌·재계약 권유 화법"
    - "20·30대 사회초년생 상담 화법"
    - "은퇴 임박 5060 상담 화법"
    - "자영업자·법인대표 상담 화법"
    - "주부·맘카페 톤 상담 화법"
    - "고소득 전문직 상담 화법"
    - "‘비싸다’ 반론 처리 화법"
    - "‘이미 들었어요’ 반론 처리 화법"
    # === 채널별 (대면 외 환경) ===
    - "전화 상담 첫 1분 라포 형성 화법"
    - "카톡 응대 톤·이모지 활용 화법"
    - "비대면 화상 상담 시선·말속도 조절 화법"
    - "세미나·설명회 후 1:1 전환 멘트"
    # === 시퀀스별 (만남 회차) ===
    - "초회 미팅 마지막 5분 다음 약속 잡기"
    - "2회차 미팅 신뢰 회복 멘트"
    - "가입 후 3개월 사후관리 콜 화법"
    - "보장 점검 정기 콜 (1년 후) 화법"
    - "가입 직전 망설임 처리 (당일 클로징)"
    # === 생애사건 트리거 ===
    - "신혼부부 첫 보험 설계 상담 화법"
    - "출산 직후 자녀 보장 점검 상담"
    - "자녀 입학·진학기 가족 보장 재점검"
    - "주택 구매 직후 가족 보장 정비 상담"
    - "정년 5년 전 노후 자산 컨설팅 화법"
    # === 페르소나 변형 ===
    - "30대 맞벌이 부부 시간 압축 상담"
    - "40대 외벌이 가장 책임감 자극 화법"
    - "60대 자녀·손주 관련 보장 상담"
    # === 톤/스타일 대비 ===
    - "단호한 클로징 vs 소프트 클로징 비교 적용"
    - "경청 위주 무압박 상담 (90% 듣기 화법)"
    - "1분 엘리베이터 피치 — 짧고 직설적"
    # === 특수 상황 ===
    - "경쟁사 견적 들고 온 고객 응대 화법"
    - "월말 마감 직전 마무리 멘트 강도 조절"
    - "부부 의견 갈릴 때 중재 화법"
    - "추천받고 온 신규 고객 첫 멘트"
  exclude_topics:
    - "보험금 청구"
    - "보상 분쟁"
    - "심사 거절 대응"
    - "약관 해석"
  # 스토리 구조 — 딱 2장. 카드 수가 많을 필요 없다는 판단으로 10장 캐러셀에서
  # 축소. 1장은 주제를 크게 던지는 표지, 2장은 간소화한 요약 + OOO 마스킹으로
  # 궁금증을 유발하고 그 자리에서 바로 "'키워드' 댓글 또는 DM" 유도까지 끝낸다
  # (generate.py PROMPT_DM_CTA_RULES). 별도 CTA 전용 장을 더 두지 않는다.
  story_structures:
    - name: "quick-hook"
      label: "초압축 2장형"
      arc: |
        cover 는 주제를 큰 타이틀로 강하게 던지는 표지 한 장. subtitle 로 짧은
        후킹 한 줄, swipe 로 2번째 장 유도.
        두 번째 장(kind: cta)이 이 세트의 전부를 압축한다: title 은 핵심 요약을
        강한 한 줄로, subtitle 은 1~2문장으로 실제 내용을 간소화해서 보여주되
        결정적 단어/문장 하나는 반드시 OOO 로 가린다. bullets 를 쓴다면 2~3개
        중 최소 하나는 OOO 로 가린 항목. 그리고 subtitle 또는 bullets 끝에
        자연스럽게 "'키워드' 댓글 또는 DM" 유도 문구로 마무리한다 — 저장/공유
        유도 아님. 이 한 장 안에서 요약과 유도를 동시에 끝내는 게 핵심이라,
        따로 CTA 전용 장을 만들지 않는다.
      cards: ["cover","cta"]
  # 캡션 톤 7종. idx % 7 로 회전. 표지의 메시지를 다른 단어로 다시 풀어쓰는 원칙은 공통.
  # "저도 처음엔…" / "👇" 를 예시에서 고정으로 안 보여주는 이유: LLM이 예시 문구를
  # 그대로 매번 재사용해서 AI 티가 났다. 각 스타일은 열기 방식을 구조로만 설명한다.
  # 마지막 CTA 줄은 전부 저장/공유가 아니라 "키워드" 댓글 또는 DM 유도로 통일
  # (generate.py 의 PROMPT_DM_CTA_RULES 참고 — 낚시(호기심 갭) +
  # "'키워드' 댓글 또는 DM" 전환 전략. 카드 cta 와 캡션이 같은 키워드를 씀).
  caption_styles:
    - name: "personal-experience"
      label: "1인칭 경험형"
      template: |
        - 1줄 hook: 화자 본인 경험 한 장면으로 시작 (결과를 먼저 던지거나, 그날 상황을
          장면처럼 묘사하거나 — 매번 같은 문장 구조 쓰지 말 것)
        - 2~3문장 1인칭 회상. 화자 프로필의 어미·말투를 그대로 쓴다
        - "키워드" 댓글 또는 DM 유도 한 줄 ("내 케이스는 다를 수 있으니 '키워드' 댓글
          이나 DM 주세요" 류, 구체 질문과 함께)
        - 마지막 줄 해시태그 5~10개 (보험설계사 관련)
    - name: "empathy-question"
      label: "질문/공감 시작형"
      template: |
        - 1줄 질문 hook. 뻔한 "이런 적 있으세요?" 류 정형 문구 대신, 화자 특유의
          말투로 구체적인 순간을 묻는다
        - 2~3문장 공감 + 본 카드에서 풀어줄 핵심 미리보기
        - 자세한 내용/맞춤 답은 "키워드" 댓글 또는 DM으로 알려준다는 유도 한 줄
        - 해시태그 5~10개
    - name: "data-stat"
      label: "관찰/경험 근거형"
      template: |
        - 1줄 hook: 현장에서 반복적으로 본 패턴을 담백하게 던진다. 소수점 배수나
          딱 떨어지는 % 같은 가짜 정밀 통계는 쓰지 말 것 — "체감상", "열에 여섯은",
          "요즘 부쩍" 같은 경험적 표현 사용
        - 2~3문장: 그래서 어떻게 해야 하는지 카드 미리보기
        - "키워드" 댓글 또는 DM 유도 한 줄 (이 패턴이 내 상황에도 맞는지 궁금하면
          '키워드' 댓글이나 DM)
        - 해시태그 5~10개
    - name: "blunt-advice"
      label: "직설 조언형"
      template: |
        - 1줄 hook: 단정적 선언으로 시작 ("이 말은 이제 그만 쓰세요" 류. 예의는
          지키되 돌리지 않고 바로 말한다)
        - 2문장: 왜 그렇게 생각하는지 화자의 경험/근거를 짧게
        - "키워드" 댓글 또는 DM 유도 한 줄 (직설적으로: "구체적인 버전 궁금하면
          '키워드' 댓글이나 DM" 류)
        - 해시태그 5~10개
    - name: "scene-first"
      label: "장면 묘사형"
      template: |
        - 1~2줄 hook: 특정 상담 장면을 영화 컷처럼 짧게 묘사 (시간/장소/상대방 반응
          중 1~2개만 구체적으로). 결과나 숫자는 아직 밝히지 않는다
        - 2문장: 그 장면에서 무슨 일이 있었는지 궁금하게 이어붙임
        - "키워드" 댓글 또는 DM 유도 한 줄 (그 뒷이야기/구체적 멘트가 궁금하면
          '키워드' 댓글이나 DM)
        - 해시태그 5~10개
    - name: "dialogue-quote"
      label: "대화 인용형"
      template: |
        - 1줄 hook: 고객 또는 화자 본인의 실제 대화 한 마디를 인용부호로 시작
        - 2~3문장: 그 말이 나온 상황과 화자가 느낀 것
        - "키워드" 댓글 또는 DM 유도 한 줄 (비슷한 상황이면 어떻게 다르게 응대할지
          '키워드' 댓글이나 DM으로 안내)
        - 해시태그 5~10개
    - name: "short-punch"
      label: "짧은 임팩트형"
      template: |
        - 1줄 hook: 5~8단어 내외로 짧고 강하게. 완전한 문장이 아니어도 됨
        - 2문장 이내로 짧게 부연 — 길게 설명하지 않는다
        - "키워드" 댓글 또는 DM 유도 짧은 한 줄 ("자세한 건 '키워드' 댓글이나 DM" 류,
          임팩트 유지)
        - 해시태그 5~10개

  # 화자 페르소나 7종. idx % 7 로 회전 (caption_styles 와 같은 idx 라 조합이
  # 매번 같이 움직이지만, 40개 토픽 풀과 맞물려 실제 반복 주기는 훨씬 길다).
  # 매번 같은 톤/말투로 쓰지 않도록 "누가 쓰는 글인지" 를 강제로 다르게 지정.
  writer_personas:
    - name: "3년차, 아직 배우는 중"
      voice: |
        입사 3년차. 아직도 배우는 게 많다고 솔직히 인정하는 톤. 잘난 척하지 않고,
        본인 실수담도 편하게 꺼낸다.
      quirks: "문장 끝을 '~하더라고요', '~였어요' 로 자주 맺음. 가끔 반말 섞인 구어체."
      emoji: "0~1개"
    - name: "10년차 베테랑, 단호함"
      voice: |
        현장 10년 넘은 베테랑. 말을 돌리지 않고 핵심만 짚는다. 가르치려 들지
        않지만 확신에 찬 어조.
      quirks: "'~합니다', '~죠' 로 문장을 짧게 끊음. 이모지 거의 안 씀."
      emoji: "0개"
    - name: "따뜻한 공감형"
      voice: |
        고객의 감정을 먼저 살피는 스타일. 실적 얘기보다 사람 얘기를 좋아한다.
        말투가 다정하고 느긋하다.
      quirks: "'~더라고요', '~싶어요' 처럼 부드러운 어미. 감탄사 가끔 사용."
      emoji: "1~2개"
    - name: "분석적인 전 회계사 출신"
      voice: |
        숫자보다 구조로 설명하는 걸 좋아한다. 상담을 논리 흐름으로 쪼개서 본다.
        비유를 자주 쓴다.
      quirks: "'~인 셈이죠', '~라고 보면 됩니다' 같은 정리형 어미."
      emoji: "0개"
    - name: "요즘 스타일, 리듬감 있는 문장"
      voice: |
        비교적 젊은 축. 문장을 짧게 툭툭 끊어 쓰고 리듬을 준다. 과하지 않은
        요즘 말투가 살짝 섞인다.
      quirks: "짧은 문장 반복. '~임', '~함' 같은 축약 어미도 가끔."
      emoji: "1~2개"
    - name: "지점장 지망, 팀 얘기 즐겨함"
      voice: |
        후배들 챙기는 걸 좋아하고, 팀에서 있었던 일을 예시로 자주 든다. 조언
        투지만 위에서 내려다보는 느낌은 없다.
      quirks: "'우리 팀에서', '후배가' 같은 표현 자주. 문장은 중간 길이."
      emoji: "0~1개"
    - name: "여담 섞는 수다형"
      voice: |
        본론 들어가기 전에 짧은 여담을 섞는 편. 정리된 3단 구성보다 대화하듯
        흘러가는 흐름을 좋아한다.
      quirks: "문장 길이가 불규칙. 괄호로 덧붙이는 말 가끔 사용."
      emoji: "1~2개"

schedule:
  slots:
    AM:   "09:00"
    NOON: "13:00"
    PM:   "17:00"
  timezone: "Asia/Seoul"

llm:
  provider: "anthropic"
  model: "claude-opus-4-7"
  max_tokens: 4096

paths:
  templates: "templates"
  output: "output"
  captions: "captions"
  input: "input"

upload:
  platform: "instagram"
  media_type: "CAROUSEL"
  share_to_feed: true

