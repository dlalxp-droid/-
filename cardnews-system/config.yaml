# 카드뉴스 자동화 설정
brand:
  # ↓ 반드시 본인 이름 또는 개인 브랜드명으로 교체하세요. 소속 GA명 표기 금지.
  name: "보.보.분"
  meta: "@bo.bo_bun"

design:
  width: 1080
  height: 1080
  cards_per_set_min: 8
  cards_per_set_max: 10
  colors:
    navy: "#0A1628"
    cream: "#F5F1E8"
    gold:  "#C8A14B"
    red:   "#B8321A"

content:
  default_topic: "보험 상담 화법"
  # 14세트(7일 × 2슬롯)면 14개 이상 두면 슬롯마다 다른 주제가 나옵니다.
  # CLI 에 --topic 을 따로 주면 단일 주제로 강제됩니다.
  topics:
    - "거절 처리 화법"
    - "니즈 환기 화법 (가족애 자극)"
    - "클로징 화법 (대안 클로징)"
    - "가족 동반 상담에서 결정권자 설득"
    - "DB콜 첫 30초 후킹 화법"
    - "기존 고객 추천 요청 화법"
    - "재무주치의 포지셔닝 화법"
    - "납입 방식 권유 화법 (장기납 vs 단기납)"
    - "리바이벌·재계약 권유 화법"
    - "20·30대 사회초년생 상담 화법"
    - "은퇴 임박 5060 상담 화법"
    - "자영업자·법인대표 상담 화법"
    - "주부·맘카페 톤 상담 화법"
    - "고소득 전문직 상담 화법"
    - "‘비싸다’ 반론 처리 화법"
    - "‘이미 들었어요’ 반론 처리 화법"
  exclude_topics:
    - "보험금 청구"
    - "보상 분쟁"
    - "심사 거절 대응"
    - "약관 해석"
  # 결과 → 문제 → 해법 흐름. 첫 장에서 결과를 보여주고 마지막까지 호기심 유지.
  structure:
    - "표지 (결과 티저)"
    - "결과 (Result — 무엇이 바뀌었는지)"
    - "전환 (Tease — 시작은 정반대였다)"
    - "문제 상황"
    - "흔한 실수 멘트 (Before)"
    - "권장 화법 (After)"
    - "심리학 근거 (카네기/아들러/치알디니 1개)"
    - "실전 팁 2~3개"
    - "한 줄 요약"
    - "CTA (저장 + 댓글/공유 유도)"

schedule:
  slots:
    AM: "08:30"
    PM: "18:00"
  timezone: "Asia/Seoul"

llm:
  provider: "anthropic"
  model: "claude-opus-4-7"
  max_tokens: 4096

paths:
  templates: "templates"
  output: "output"
  captions: "captions"
  input: "input"

upload:
  platform: "instagram"
  media_type: "CAROUSEL"
  share_to_feed: true

