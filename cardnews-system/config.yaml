# 카드뉴스 자동화 설정
brand:
  # ↓ 반드시 본인 이름 또는 개인 브랜드명으로 교체하세요. 소속 GA명 표기 금지.
  name: "보.보.분"
  meta: "@bo.bo_bun"

design:
  width: 1080
  height: 1080
  cards_per_set_min: 8
  cards_per_set_max: 10
  # 6개의 따뜻한 프리미엄 팔레트. 토픽 인덱스 % 6 으로 결정적으로 선택되어
  # 같은 토픽은 항상 같은 팔레트, 토픽이 다르면 색조가 달라진다.
  # deep-navy-cream(옛 default 톤) 은 의도적으로 마지막. 첫 토픽들이 새 톤으로 보이도록.
  # bg=배경, ink=텍스트/짙은면, accent=골드/밑줄, pop=강조/Before
  palettes:
    - name: "mocha-sage"
      bg:     "#EFE7DA"
      ink:    "#3A2E26"
      accent: "#8FA585"
      pop:    "#7C4A3A"
    - name: "wine-oat"
      bg:     "#EDE2CD"
      ink:    "#3D1F2D"
      accent: "#B8853A"
      pop:    "#8C2C3D"
    - name: "forest-cream"
      bg:     "#F0EAD9"
      ink:    "#1F3A2E"
      accent: "#B8923A"
      pop:    "#A04A1F"
    - name: "indigo-peach"
      bg:     "#F4E4D4"
      ink:    "#1F2A4D"
      accent: "#E8956A"
      pop:    "#C44E2C"
    - name: "charcoal-mustard"
      bg:     "#EFE8DA"
      ink:    "#2D2A26"
      accent: "#D4A437"
      pop:    "#A04A28"
    - name: "deep-navy-cream"
      bg:     "#F5F1E8"
      ink:    "#0A1628"
      accent: "#C8A14B"
      pop:    "#B8321A"
  # 토픽 인덱스 % 3 으로 표지 레이아웃 변형 선택.
  #   var-a: 짙은 잉크 풀배경 + 액센트 아이브로우 (기존)
  #   var-b: 밝은 배경 + 두꺼운 액센트 프레임
  #   var-c: 밝은 배경 + 상단 액센트 스트라이프
  cover_variants: ["var-a", "var-b", "var-c"]
  # 호환용 단일 색상 (palettes 미존재 시 폴백). 신규 코드는 사용 안 함.
  colors:
    navy: "#0A1628"
    cream: "#F5F1E8"
    gold:  "#C8A14B"
    red:   "#B8321A"

content:
  default_topic: "보험 상담 화법"
  # 14세트(7일 × 2슬롯)면 14개 이상 두면 슬롯마다 다른 주제가 나옵니다.
  # CLI 에 --topic 을 따로 주면 단일 주제로 강제됩니다.
  topics:
    - "거절 처리 화법"
    - "니즈 환기 화법 (가족애 자극)"
    - "클로징 화법 (대안 클로징)"
    - "가족 동반 상담에서 결정권자 설득"
    - "DB콜 첫 30초 후킹 화법"
    - "기존 고객 추천 요청 화법"
    - "재무주치의 포지셔닝 화법"
    - "납입 방식 권유 화법 (장기납 vs 단기납)"
    - "리바이벌·재계약 권유 화법"
    - "20·30대 사회초년생 상담 화법"
    - "은퇴 임박 5060 상담 화법"
    - "자영업자·법인대표 상담 화법"
    - "주부·맘카페 톤 상담 화법"
    - "고소득 전문직 상담 화법"
    - "‘비싸다’ 반론 처리 화법"
    - "‘이미 들었어요’ 반론 처리 화법"
  exclude_topics:
    - "보험금 청구"
    - "보상 분쟁"
    - "심사 거절 대응"
    - "약관 해석"
  # 결과 → 문제 → 해법 흐름. 첫 장에서 결과를 보여주고 마지막까지 호기심 유지.
  structure:
    - "표지 (결과 티저)"
    - "결과 (Result — 무엇이 바뀌었는지)"
    - "전환 (Tease — 시작은 정반대였다)"
    - "문제 상황"
    - "흔한 실수 멘트 (Before)"
    - "권장 화법 (After)"
    - "심리학 근거 (카네기/아들러/치알디니 1개)"
    - "실전 팁 2~3개"
    - "한 줄 요약"
    - "CTA (저장 + 댓글/공유 유도)"

schedule:
  slots:
    AM:   "09:00"
    NOON: "13:00"
    PM:   "17:00"
  timezone: "Asia/Seoul"

llm:
  provider: "anthropic"
  model: "claude-opus-4-7"
  max_tokens: 4096

paths:
  templates: "templates"
  output: "output"
  captions: "captions"
  input: "input"

upload:
  platform: "instagram"
  media_type: "CAROUSEL"
  share_to_feed: true

