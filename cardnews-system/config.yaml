# 카드뉴스 자동화 설정
brand:
  # ↓ 반드시 본인 이름 또는 개인 브랜드명으로 교체하세요. 소속 GA명 표기 금지.
  name: "보.보.분"
  meta: "@bo.bo_bun"

design:
  width: 1080
  height: 1080
  cards_per_set_min: 8
  cards_per_set_max: 10
  # 6개의 따뜻한 프리미엄 팔레트. 토픽 인덱스 % 6 으로 결정적으로 선택되어
  # 같은 토픽은 항상 같은 팔레트, 토픽이 다르면 색조가 달라진다.
  # deep-navy-cream(옛 default 톤) 은 의도적으로 마지막. 첫 토픽들이 새 톤으로 보이도록.
  # bg=배경, ink=텍스트/짙은면, accent=골드/밑줄, pop=강조/Before
  palettes:
    - name: "mocha-sage"
      bg:     "#EFE7DA"
      ink:    "#3A2E26"
      accent: "#8FA585"
      pop:    "#7C4A3A"
    - name: "wine-oat"
      bg:     "#EDE2CD"
      ink:    "#3D1F2D"
      accent: "#B8853A"
      pop:    "#8C2C3D"
    - name: "forest-cream"
      bg:     "#F0EAD9"
      ink:    "#1F3A2E"
      accent: "#B8923A"
      pop:    "#A04A1F"
    - name: "indigo-peach"
      bg:     "#F4E4D4"
      ink:    "#1F2A4D"
      accent: "#E8956A"
      pop:    "#C44E2C"
    - name: "charcoal-mustard"
      bg:     "#EFE8DA"
      ink:    "#2D2A26"
      accent: "#D4A437"
      pop:    "#A04A28"
    - name: "deep-navy-cream"
      bg:     "#F5F1E8"
      ink:    "#0A1628"
      accent: "#C8A14B"
      pop:    "#B8321A"
  # 토픽 인덱스 % 3 으로 표지 레이아웃 변형 선택.
  #   var-a: 짙은 잉크 풀배경 + 액센트 아이브로우 (기존)
  #   var-b: 밝은 배경 + 두꺼운 액센트 프레임
  #   var-c: 밝은 배경 + 상단 액센트 스트라이프
  cover_variants: ["var-a", "var-b", "var-c"]
  # 호환용 단일 색상 (palettes 미존재 시 폴백). 신규 코드는 사용 안 함.
  colors:
    navy: "#0A1628"
    cream: "#F5F1E8"
    gold:  "#C8A14B"
    red:   "#B8321A"

content:
  default_topic: "보험 상담 화법"
  # 40개 토픽. 슬롯마다 idx % len(topics) 로 회전 → 한 주(21슬롯) 안에 동일 주제 안 나옴.
  # CLI 에 --topic 을 따로 주면 단일 주제로 강제됩니다.
  topics:
    # === 핵심 화법 (기본 16) ===
    - "거절 처리 화법"
    - "니즈 환기 화법 (가족애 자극)"
    - "클로징 화법 (대안 클로징)"
    - "가족 동반 상담에서 결정권자 설득"
    - "DB콜 첫 30초 후킹 화법"
    - "기존 고객 추천 요청 화법"
    - "재무주치의 포지셔닝 화법"
    - "납입 방식 권유 화법 (장기납 vs 단기납)"
    - "리바이벌·재계약 권유 화법"
    - "20·30대 사회초년생 상담 화법"
    - "은퇴 임박 5060 상담 화법"
    - "자영업자·법인대표 상담 화법"
    - "주부·맘카페 톤 상담 화법"
    - "고소득 전문직 상담 화법"
    - "‘비싸다’ 반론 처리 화법"
    - "‘이미 들었어요’ 반론 처리 화법"
    # === 채널별 (대면 외 환경) ===
    - "전화 상담 첫 1분 라포 형성 화법"
    - "카톡 응대 톤·이모지 활용 화법"
    - "비대면 화상 상담 시선·말속도 조절 화법"
    - "세미나·설명회 후 1:1 전환 멘트"
    # === 시퀀스별 (만남 회차) ===
    - "초회 미팅 마지막 5분 다음 약속 잡기"
    - "2회차 미팅 신뢰 회복 멘트"
    - "가입 후 3개월 사후관리 콜 화법"
    - "보장 점검 정기 콜 (1년 후) 화법"
    - "가입 직전 망설임 처리 (당일 클로징)"
    # === 생애사건 트리거 ===
    - "신혼부부 첫 보험 설계 상담 화법"
    - "출산 직후 자녀 보장 점검 상담"
    - "자녀 입학·진학기 가족 보장 재점검"
    - "주택 구매 직후 가족 보장 정비 상담"
    - "정년 5년 전 노후 자산 컨설팅 화법"
    # === 페르소나 변형 ===
    - "30대 맞벌이 부부 시간 압축 상담"
    - "40대 외벌이 가장 책임감 자극 화법"
    - "60대 자녀·손주 관련 보장 상담"
    # === 톤/스타일 대비 ===
    - "단호한 클로징 vs 소프트 클로징 비교 적용"
    - "경청 위주 무압박 상담 (90% 듣기 화법)"
    - "1분 엘리베이터 피치 — 짧고 직설적"
    # === 특수 상황 ===
    - "경쟁사 견적 들고 온 고객 응대 화법"
    - "월말 마감 직전 마무리 멘트 강도 조절"
    - "부부 의견 갈릴 때 중재 화법"
    - "추천받고 온 신규 고객 첫 멘트"
  exclude_topics:
    - "보험금 청구"
    - "보상 분쟁"
    - "심사 거절 대응"
    - "약관 해석"
  # 스토리 구조 5종. idx % 5 로 회전 → 같은 구조가 연속 슬롯에 안 나옴.
  # 각 구조의 cards 시퀀스는 LLM 이 생성할 카드 kind 순서. 마지막은 항상 cta.
  story_structures:
    - name: "result-recall"
      label: "결과 회상형"
      arc: |
        결과를 먼저 보여주고 어떻게 됐는지를 늦게 공개. cliffhanger 로 매 장 끊는다.
        Before/After 대비로 멘트 변경 효과 명확히. 7번 카드에 권위자(카네기/아들러/치알디니/매슬로/카네만 등) 1명 인용.
      cards: ["cover","result","tease","problem","before","after","insight","tips","summary","cta"]
    - name: "case-study"
      label: "케이스 스터디형"
      arc: |
        한 명의 가상 고객 페르소나 중심 단편 스토리. cover 는 그 고객의 결과 한 줄("OO 고객, OO만에 결정"),
        persona 는 인구통계+고민, scene 은 첫 미팅 분위기, conflict 는 막힌 지점,
        turning 은 어떤 멘트가 전환했는지, before/after 카드는 그 멘트 대비,
        outcome 은 후일담(구체 수치/반응), lesson 은 일반화한 1줄 교훈.
        가공의 이름(예: "김OO 님, 38세, 카페 운영")·금액·기간을 현실감 있게 넣는다.
      cards: ["cover","persona","scene","conflict","turning","before","after","outcome","lesson","cta"]
    - name: "qna"
      label: "Q&A 모음형"
      arc: |
        동료들이 자주 받는 질문 6개 모음. cover 는 "동료들이 가장 자주 묻는 6가지" 류 티저.
        intro 는 짧은 도입 한 줄. qa1~qa6 카드는 eyebrow=Q1~Q6, title=질문 한 줄(12~14자),
        subtitle=핵심 답변 멘트(60자), bullets 로 추가 팁 1~2개.
        스크롤하며 각 장을 발췌해 저장하기 좋게 만든다. summary 는 6개 답변의 공통 원칙 1줄.
      cards: ["cover","intro","qa1","qa2","qa3","qa4","qa5","qa6","summary","cta"]
    - name: "ranking"
      label: "랭킹/비교형"
      arc: |
        "현장에서 가장 자주 망하는 멘트 TOP 5" 류 카운트다운. cover 는 랭킹 티저.
        intro 는 데이터·관찰 근거 한 줄. rank5~rank2 는 eyebrow=#5/#4/#3/#2,
        title=망하는 멘트(짧게), subtitle=왜 망하는지 한 줄. rank1 은 #1 강조 + 대안 멘트.
        insight 는 5개 공통 원리. 위로 갈수록 더 자극적·명확하게.
      cards: ["cover","intro","rank5","rank4","rank3","rank2","rank1","insight","summary","cta"]
    - name: "dialogue"
      label: "대화 인용형"
      arc: |
        실제 상담 다이얼로그 5턴 인용. cover 는 대화 한 줄 인용("OO" — 그 한 마디로 결정됐다).
        setup 은 상황·페르소나 한 줄. turn1~turn5 는 each card kind=before/after-style:
        before=고객 발화(60자 이내), after=설계사 응대 멘트(60자 이내). swipe 로 다음 턴 예고.
        analysis 는 왜 통했는지, lesson 은 일반화 1줄.
      cards: ["cover","setup","turn1","turn2","turn3","turn4","turn5","analysis","lesson","cta"]
  # 캡션 톤 3종. idx % 3 로 회전. 표지의 메시지를 다른 단어로 다시 풀어쓰는 원칙은 공통.
  caption_styles:
    - name: "personal-experience"
      label: "1인칭 경험형"
      template: |
        - 1줄 hook: 결과 티저 + 끝에 "👇" 또는 "스와이프" 유도
        - 2~3문장 1인칭 회상 ("저도 처음엔…")
        - 댓글/저장/공유 유도 한 줄 (구체 질문 + 공유 권유)
        - 마지막 줄 해시태그 5~10개 (보험설계사 관련)
    - name: "empathy-question"
      label: "질문/공감 시작형"
      template: |
        - 1줄 질문 hook ("이런 상담 받아본 적 있죠?" / "이럴 때 보통 어떻게 하세요?")
        - 2~3문장 공감 + 본 카드에서 풀어줄 핵심 미리보기
        - 댓글로 본인 경험·노하우 공유 유도
        - 해시태그 5~10개
    - name: "data-stat"
      label: "데이터/숫자 인용형"
      template: |
        - 1줄 통계·숫자 hook ("OO%의 상담은 첫 30초에 결정된다는데")
        - 2~3문장: 그래서 어떻게 해야 하는지 카드 미리보기
        - 댓글·공유 유도 한 줄
        - 해시태그 5~10개

schedule:
  slots:
    AM:   "09:00"
    NOON: "13:00"
    PM:   "17:00"
  timezone: "Asia/Seoul"

llm:
  provider: "anthropic"
  model: "claude-opus-4-7"
  max_tokens: 4096

paths:
  templates: "templates"
  output: "output"
  captions: "captions"
  input: "input"

upload:
  platform: "instagram"
  media_type: "CAROUSEL"
  share_to_feed: true

